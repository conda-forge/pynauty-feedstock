schema_version: 1

context:
  name: pynauty
  version: "2.8.8.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pynauty-${{ version }}.tar.gz
  sha256: 454d3b0e605d649d13478afb090daef4a152f15c4a337a391fe69fded7e683f2
  patches:
    - setup.patch

build:
  number: 4
  skip: win
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - pip
    - python
    - setuptools
    - nauty =2.7.1
  run:
    - python
    - ${{ pin_compatible('nauty', upper_bound='x.x.x') }}

tests:
  - python:
      imports:
        - pynauty
        - pynauty.graph
      pip_check: true

about:
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: Isomorphism testing and automorphisms of graphs
  description: |
    Pynauty can be used to compare graphs for isomorphism and to determine
    their automorphism group in a Python programming environment. Pynauty
    is a Python/C extension module using library components from the Nauty
    package by Brendan McKay.
  homepage: https://github.com/pdobsan/pynauty
  repository: https://github.com/pdobsan/pynauty
  documentation: https://github.com/pdobsan/pynauty

extra:
  recipe-maintainers:
    - jan-janssen
